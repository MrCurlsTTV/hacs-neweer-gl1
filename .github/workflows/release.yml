name: Release

on:
  push:
    branches: [main]
    paths:
      - custom_components/neewer_wifi/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release for the manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version custom_components/neewer_wifi/manifest.json)
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists, nothing to do"
            exit 0
          fi
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --generate-notes
